<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        select, input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        select:focus, input:focus {
            border-color: #007bff;
            outline: none;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        .result-positive {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .result-negative {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .loading {
            text-align: center;
            margin-top: 10px;
            display: none;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Diabetes Risk Predictor</h1>
    <form id="predictionForm">
        <div class="form-grid">
            <!-- Model Selection -->
            <div class="form-group full-width">
                <label for="modelSelect">Select Model</label>
                <select id="modelSelect" required>
                    <option value="ensemble">Ensemble (Recommended)</option>
                    <option value="lgbm">LightGBM</option>
                    <option value="xgb">XGBoost</option>
                    <option value="cb">CatBoost</option>
                </select>
            </div>

            <!-- Features -->
            <div class="form-group">
                <label for="highbp">High Blood Pressure</label>
                <select id="highbp" name="highbp">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label for="highchol">High Cholesterol</label>
                <select id="highchol" name="highchol">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label for="cholcheck">Cholesterol Check (in 5 years)</label>
                <select id="cholcheck" name="cholcheck">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label for="bmi">BMI</label>
                <input type="number" id="bmi" name="bmi" min="10" max="100" step="0.1" value="25" required>
            </div>

            <div class="form-group">
                <label for="smoker">Smoker (At least 100 cigs)</label>
                <select id="smoker" name="smoker">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label for="stroke">History of Stroke</label>
                <select id="stroke" name="stroke">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label for="heartdiseaseorattack">Heart Disease or Attack</label>
                <select id="heartdiseaseorattack" name="heartdiseaseorattack">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label for="physactivity">Physical Activity (past 30 days)</label>
                <select id="physactivity" name="physactivity">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label for="hvyalcoholconsump">Heavy Alcohol Consumption</label>
                <select id="hvyalcoholconsump" name="hvyalcoholconsump">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label for="anyhealthcare">Any Healthcare Coverage</label>
                <select id="anyhealthcare" name="anyhealthcare">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label for="nodocbccost">No Doctor because of Cost</label>
                <select id="nodocbccost" name="nodocbccost">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label for="genhlth">General Health (1=Excellent, 5=Poor)</label>
                <select id="genhlth" name="genhlth">
                    <option value="1">1 - Excellent</option>
                    <option value="2">2 - Very Good</option>
                    <option value="3">3 - Good</option>
                    <option value="4">4 - Fair</option>
                    <option value="5">5 - Poor</option>
                </select>
            </div>

            <div class="form-group">
                <label for="menthlth">Mental Health (Days poor in last 30)</label>
                <input type="number" id="menthlth" name="menthlth" min="0" max="30" value="0" required>
            </div>

            <div class="form-group">
                <label for="physhlth">Physical Health (Days poor in last 30)</label>
                <input type="number" id="physhlth" name="physhlth" min="0" max="30" value="0" required>
            </div>

            <div class="form-group">
                <label for="diffwalk">Difficulty Walking</label>
                <select id="diffwalk" name="diffwalk">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label for="sex">Sex</label>
                <select id="sex" name="sex">
                    <option value="0">Female</option>
                    <option value="1">Male</option>
                </select>
            </div>

            <div class="form-group">
                <label for="age">Age Category</label>
                <select id="age" name="age">
                    <option value="1">18-24</option>
                    <option value="2">25-29</option>
                    <option value="3">30-34</option>
                    <option value="4">35-39</option>
                    <option value="5">40-44</option>
                    <option value="6">45-49</option>
                    <option value="7">50-54</option>
                    <option value="8">55-59</option>
                    <option value="9">60-64</option>
                    <option value="10">65-69</option>
                    <option value="11">70-74</option>
                    <option value="12">75-79</option>
                    <option value="13">80+</option>
                </select>
            </div>

            <div class="form-group">
                <label for="education">Education Level</label>
                <select id="education" name="education">
                    <option value="1">Never attended school or only kindergarten</option>
                    <option value="2">Grades 1 through 8 (Elementary)</option>
                    <option value="3">Grades 9 through 11 (Some high school)</option>
                    <option value="4">Grade 12 or GED (High school graduate)</option>
                    <option value="5">College 1 year to 3 years (Some college or technical school)</option>
                    <option value="6">College 4 years or more (College graduate)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="income">Income Level</label>
                <select id="income" name="income">
                    <option value="1">Less than $10,000</option>
                    <option value="2">$10,000 to less than $15,000</option>
                    <option value="3">$15,000 to less than $20,000</option>
                    <option value="4">$20,000 to less than $25,000</option>
                    <option value="5">$25,000 to less than $35,000</option>
                    <option value="6">$35,000 to less than $50,000</option>
                    <option value="7">$50,000 to less than $75,000</option>
                    <option value="8">$75,000 or more</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fruit_veggie_consumption">Consumes Fruit/Veggies Daily?</label>
                <select id="fruit_veggie_consumption" name="fruit_veggie_consumption">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>
        </div>

        <button type="submit">Predict</button>
    </form>

    <div id="loading" class="loading">Processing...</div>
    <div id="result"></div>
</div>

<script>
    document.getElementById('predictionForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const resultDiv = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');
        
        resultDiv.style.display = 'none';
        loadingDiv.style.display = 'block';

        const formData = new FormData(e.target);
        const data = {};
        
        // Convert form data to object with correct types
        for (let [key, value] of formData.entries()) {
            // All inputs in this model are numeric
            data[key] = parseFloat(value);
        }

        const model = document.getElementById('modelSelect').value;
        let endpoint = '';
        
        switch(model) {
            case 'ensemble':
                endpoint = '/predict/ensemble';
                break;
            case 'lgbm':
                endpoint = '/predict/lgbm';
                break;
            case 'xgb':
                endpoint = '/predict/xgb';
                break;
            case 'cb':
                endpoint = '/predict/cb';
                break;
            default:
                endpoint = '/predict/ensemble';
        }

        // Assuming the service is running on localhost:3000
        // If serving this file from the same origin, use relative path
        // If opening file directly, you might need the full URL: http://localhost:3000/predict/...
        const baseUrl = 'http://localhost:3000'; 
        const url = `${baseUrl}${endpoint}`;

        // Wrap data in "input_data" key as expected by BentoML
        const payload = { input_data: data };

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const result = await response.json();
            
            loadingDiv.style.display = 'none';
            resultDiv.style.display = 'block';
            
            let predictionValue = 0;
            let message = '';

            if (model === 'ensemble') {
                predictionValue = result.final_prediction;
            } else if (model === 'lgbm') {
                predictionValue = result.LGBM_Prediction;
            } else if (model === 'xgb') {
                predictionValue = result.XGB_Prediction;
            } else if (model === 'cb') {
                // Assuming CB returns similar structure, though not explicitly seen in snippet
                // Based on service.py snippet, it likely returns a dict too.
                // Let's handle the generic case or specific keys if known.
                // The snippet for CB was cut off, but following the pattern:
                predictionValue = Object.values(result)[0]; 
            }

            if (predictionValue === 1) {
                resultDiv.className = 'result-positive';
                resultDiv.innerHTML = `<strong>High Risk:</strong> The model predicts a high risk of diabetes.`;
            } else {
                resultDiv.className = 'result-negative';
                resultDiv.innerHTML = `<strong>Low Risk:</strong> The model predicts a low risk of diabetes.`;
            }
            
            // For ensemble, show details
            if (model === 'ensemble' && result.individual_predictions) {
                let details = '<br><small>Individual Models: ';
                for (const [m, p] of Object.entries(result.individual_predictions)) {
                    details += `${m.toUpperCase()}: ${p === 1 ? 'High' : 'Low'}, `;
                }
                details = details.slice(0, -2) + '</small>';
                resultDiv.innerHTML += details;
            }

        } catch (error) {
            loadingDiv.style.display = 'none';
            resultDiv.style.display = 'block';
            resultDiv.className = '';
            resultDiv.style.backgroundColor = '#ffeeba';
            resultDiv.style.color = '#856404';
            resultDiv.innerHTML = `Error: ${error.message}. Ensure the backend service is running at ${baseUrl}`;
        }
    });
</script>

</body>
</html>
